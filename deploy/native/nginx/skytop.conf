# /etc/nginx/sites-available/skytop — Sky Top behind HTTPS.
# Replace every YOUR_DOMAIN (e.g. app.skytop-travel.com), then:
#   sudo ln -s /etc/nginx/sites-available/skytop /etc/nginx/sites-enabled/skytop
#   sudo nginx -t && sudo systemctl reload nginx
# Certificates: see deploy/native/README.md (certbot). Until they exist, use the
# HTTP-only bootstrap described there.

upstream skytop_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# HTTP: ACME challenges, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    charset utf-8;

    # Built client (npm run build in client/). Private uploads are NOT here:
    # they live in /var/lib/skytop/uploads and are only served by the API.
    root /opt/skytop/app/client/dist;
    index index.html;

    # Pilgrim creation sends a passport image + a personal photo (8 MB each
    # in the API) plus form fields.
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # API → Node (bound to 127.0.0.1:4000). Helmet sets the API's security
    # headers; HSTS is added here for every response.
    location /api/ {
        proxy_pass http://skytop_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (never append to) the client-supplied value: with
        # TRUST_PROXY=loopback the API sees the real client IP, unspoofable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Hashed build assets: cache for a year.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/skytop-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # SPA: unknown paths → index.html (React Router). index.html is never
    # cached so a new release is picked up immediately.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/skytop-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/skytop-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Never serve dotfiles (.env, .git ...).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
