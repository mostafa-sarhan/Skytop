# /etc/nginx/sites-available/skytop — host Nginx in front of the Docker stack.
# Replace every YOUR_DOMAIN (e.g. app.skytop-travel.com), then:
#   sudo ln -s /etc/nginx/sites-available/skytop /etc/nginx/sites-enabled/skytop
#   sudo nginx -t && sudo systemctl reload nginx
# Until the certificate exists use deploy/nginx/skytop-bootstrap.conf
# (HTTP only), see deploy/README.md → HTTPS.
#
#   /       → frontend container   127.0.0.1:8080 (static client, security headers, caching)
#   /api/   → backend container    127.0.0.1:4000 (Express API, private files)
# Both ports are published on loopback only; PostgreSQL is not published.

upstream skytop_frontend {
    server 127.0.0.1:8080;
    keepalive 8;
}

upstream skytop_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# HTTP: ACME challenges, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    charset utf-8;

    # HTTPS is terminated here, so HSTS is added here for every response
    # (the containers add the other security headers).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Shared by both upstreams. X-Forwarded-For is overwritten (never
    # appended): the API trusts it only from this proxy, so clients cannot
    # spoof their IP to dodge rate limits.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;

    # API (JSON, file downloads, PDF / Excel reports). Pilgrim creation sends a
    # passport image + a personal photo (8 MB each in the API) plus fields.
    location /api/ {
        proxy_pass http://skytop_api;
        client_max_body_size 20m;
        # Report generation (PDF / Excel) can take a while on large data;
        # matches the API's own 120 s request timeout.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        gzip on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_types application/json text/plain;
    }

    # Static client (headers, caching and SPA fallback are set by the
    # frontend container). No request bodies here.
    location / {
        proxy_pass http://skytop_frontend;
        client_max_body_size 1k;
        proxy_read_timeout 30s;
    }

    # Never forward dotfiles (.env, .git ...).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
