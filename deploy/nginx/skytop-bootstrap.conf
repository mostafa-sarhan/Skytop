# /etc/nginx/sites-available/skytop — TEMPORARY, HTTP only, used once to
# obtain the first Let's Encrypt certificate (deploy/README.md → HTTPS).
# Replace YOUR_DOMAIN. After `certbot certonly --webroot` succeeds, replace
# this file with deploy/nginx/skytop.conf.
# The app is deliberately not served over plain HTTP: the session cookie is
# Secure-only, so sign-in would not work anyway.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        return 503 "Sky Top: HTTPS is being set up.\n";
    }
}
