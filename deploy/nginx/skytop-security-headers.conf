# /etc/nginx/snippets/skytop-security-headers.conf — headers for the client
# (static files). Included per location because Nginx does not inherit
# add_header into locations that define their own.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# No inline scripts (the theme bootstrap is /theme-init.js); inline styles are
# used by React style attributes. Files (passports, receipts) open from the
# same origin; upload previews use blob: URLs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
