# Sky Top client container (nginx-unprivileged, port 8080). Serves the Vite
# build only: private uploads never exist in this container, and /api/ is
# routed to the backend by the host Nginx before it reaches this server.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Container health check (compose / Docker HEALTHCHECK).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never answer API paths with the SPA shell (a misrouted /api request
    # must fail visibly, not return index.html with 200).
    location /api/ {
        return 404;
    }

    # Hashed build assets: cache for a year.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # SPA: unknown paths → index.html (React Router). index.html is never
    # cached so a new release is picked up immediately.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
